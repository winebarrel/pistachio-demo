name: Update pista
on:
  schedule:
    # Every day at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -xeo pipefail {0}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # A pull request that GITHUB_TOKEN opens waits for approval before its CI
      # runs, and a merge made with it does not start the deploy on main. An
      # app token does neither.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Open a pull request for a new pista release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The playground offers the newest three releases, newest first.
          # Drafts and prereleases are left out.
          wanted=$(gh release list --repo winebarrel/pistachio --limit 20 \
            --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '[.[].tagName | ltrimstr("v")][:3] | join(" ")')
          current=$(sed -n 's/^ARG PISTA_VERSIONS="\(.*\)"$/\1/p' Dockerfile)
          latest=${wanted%% *}

          if [[ "$wanted" == "$current" ]]; then
            echo "pista $current are the newest releases"
            exit 0
          fi

          branch="update-pista-$latest"
          if git ls-remote --exit-code --heads origin "$branch"; then
            # A pull request for this branch, open or closed, means the work is
            # done or was turned down. A branch without one is left from a run
            # that pushed it and then failed to open the pull request.
            prs=$(gh pr list --head "$branch" --state all --json number --jq length)
            if [[ "$prs" != 0 ]]; then
              echo "$branch already has a pull request"
              exit 0
            fi
            echo "$branch exists without a pull request; opening one"
          else
            sed -i "s/^ARG PISTA_VERSIONS=.*/ARG PISTA_VERSIONS=\"$wanted\"/" Dockerfile

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git commit -am "Update pista to $latest"
            git push origin "$branch"
          fi

          gh pr create \
            --head "$branch" \
            --title "Update pista to $latest" \
            --body "Offers pista $wanted, in place of $current.

          Release notes: https://github.com/winebarrel/pistachio/releases/tag/v$latest"

          # Merges once the required checks pass.
          gh pr merge "$branch" --auto --merge
