name: Update pista
on:
  schedule:
    # Every day at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash -xeo pipefail {0}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # A pull request opened with GITHUB_TOKEN does not start CI. Set
      # PISTA_UPDATE_TOKEN to a token that can push and open pull requests on
      # this repository so that CI runs on the pull request.
      GH_TOKEN: ${{ secrets.PISTA_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.PISTA_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Open a pull request for a new pista release
        run: |
          latest=$(gh release view --repo winebarrel/pistachio --json tagName --jq .tagName)
          latest=${latest#v}
          current=$(sed -n 's/^ARG PISTA_VERSION=//p' Dockerfile)

          if [[ "$latest" == "$current" ]]; then
            echo "pista $current is the latest release"
            exit 0
          fi

          branch="update-pista-$latest"
          if git ls-remote --exit-code --heads origin "$branch"; then
            echo "$branch already exists"
            exit 0
          fi

          sed -i "s/^ARG PISTA_VERSION=.*/ARG PISTA_VERSION=$latest/" Dockerfile

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update pista to $latest"
          git push origin "$branch"

          gh pr create \
            --head "$branch" \
            --title "Update pista to $latest" \
            --body "Updates pista from $current to $latest.

          Release notes: https://github.com/winebarrel/pistachio/releases/tag/v$latest"
