<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pistachio playground</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.min.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/sql/sql.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/addon/runmode/runmode.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #1f2328;
    --muted: #656d76;
    --border: #d0d7de;
    --accent: #5a8f29;
    --accent-text: #ffffff;
    --error: #cf222e;
    --code-bg: #f6f8fa;
    --gutter: #8c959f;
    --tok-keyword: #cf222e;
    --tok-type: #8250df;
    --tok-string: #0a3069;
    --tok-number: #0550ae;
    --tok-comment: #6e7781;
    --tok-builtin: #953800;
    --tok-operator: #1f2328;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #e6edf3;
      --muted: #8d96a0;
      --border: #30363d;
      --accent: #7cb342;
      --accent-text: #0d1117;
      --error: #ff7b72;
      --code-bg: #0d1117;
      --gutter: #6e7681;
      --tok-keyword: #ff7b72;
      --tok-type: #d2a8ff;
      --tok-string: #a5d6ff;
      --tok-number: #79c0ff;
      --tok-comment: #8b949e;
      --tok-builtin: #ffa657;
      --tok-operator: #e6edf3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 16px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 0; color: var(--muted); }
  header a { color: var(--accent); }
  main { padding: 16px; display: grid; gap: 16px; }
  .editors {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 800px) {
    .editors { grid-template-columns: 1fr; }
  }
  .panel {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    min-width: 0;
  }
  .panel h2 {
    margin: 0;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .panel h2 span { color: var(--muted); font-weight: normal; }
  .CodeMirror, #output {
    margin: 0;
    padding: 12px;
    border: 0;
    background: var(--code-bg);
    color: var(--text);
    font: 12px/1.5 var(--mono);
    tab-size: 4;
  }
  /* CodeMirror wants its padding on the lines, not the wrapper. */
  .CodeMirror { padding: 0; }
  .CodeMirror-lines { padding: 12px 0; }
  .CodeMirror pre.CodeMirror-line { padding: 0 12px; }
  .CodeMirror {
    height: 420px;
    border-radius: 0 0 6px 6px;
  }
  @media (max-width: 800px) {
    .CodeMirror { height: 300px; }
  }
  .CodeMirror-focused { outline: 2px solid var(--accent); outline-offset: -2px; }
  .CodeMirror-gutters { background: var(--code-bg); border-right: 1px solid var(--border); }
  .CodeMirror-linenumber { color: var(--gutter); }
  .CodeMirror-cursor { border-left-color: var(--text); }
  .CodeMirror-selected { background: color-mix(in srgb, var(--accent) 25%, transparent) !important; }
  .cm-s-pista .cm-keyword { color: var(--tok-keyword); }
  .cm-s-pista .cm-type, .cm-s-pista .cm-variable-3 { color: var(--tok-type); }
  .cm-s-pista .cm-string, .cm-s-pista .cm-string-2 { color: var(--tok-string); }
  .cm-s-pista .cm-number, .cm-s-pista .cm-atom { color: var(--tok-number); }
  .cm-s-pista .cm-comment { color: var(--tok-comment); font-style: italic; }
  .cm-s-pista .cm-builtin { color: var(--tok-builtin); }
  .cm-s-pista .cm-operator { color: var(--tok-operator); }
  #output {
    min-height: 120px;
    overflow: auto;
    border-radius: 0 0 6px 6px;
  }
  #output.error { color: var(--error); }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
  }
  .controls label { display: inline-flex; align-items: center; gap: 4px; }
  .controls select { font: inherit; }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
  }
  button:disabled { opacity: 0.6; cursor: progress; }
  .hint { color: var(--muted); font-size: 12px; }
  /* The status sits in the output header so a longer message never wraps
     the controls and pushes the output down. */
  .output-header { display: flex; align-items: baseline; gap: 12px; }
  #status {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
    font-weight: normal;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
<header>
  <h1>pistachio playground</h1>
  <p>
    Edit the two schemas and run <code>pista diff</code> to see the DDL that
    takes the current one to the desired one. No database is involved.
    <a href="https://github.com/winebarrel/pistachio">GitHub</a>
  </p>
</header>
<main>
  <div class="editors">
    <section class="panel">
      <h2>current.sql <span>- what the database holds now</span></h2>
      <textarea id="current" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </section>
    <section class="panel">
      <h2>desired.sql <span>- what you want it to hold</span></h2>
      <textarea id="desired" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </section>
  </div>

  <div class="controls">
    <button id="run" class="primary">Run pista diff</button>
    <label><input type="checkbox" id="manage-routine" checked> --manage-routine</label>
    <label><input type="checkbox" id="bulk-alter"> --bulk-alter</label>
    <label>--allow-drop
      <select id="allow-drop">
        <option value="">(none)</option>
        <option value="all">all</option>
        <option value="table">table</option>
        <option value="view">view</option>
        <option value="enum">enum</option>
        <option value="domain">domain</option>
        <option value="composite_type">composite_type</option>
        <option value="sequence">sequence</option>
        <option value="routine">routine</option>
        <option value="column">column</option>
        <option value="constraint">constraint</option>
        <option value="foreign_key">foreign_key</option>
        <option value="index">index</option>
        <option value="policy">policy</option>
        <option value="trigger">trigger</option>
      </select>
    </label>
    <button id="reset">Reset to sample</button>
    <span class="hint">Ctrl+Enter / Cmd+Enter runs the diff.</span>
  </div>

  <section class="panel">
    <h2 class="output-header">Output <span id="status"></span></h2>
    <pre id="output" class="cm-s-pista"></pre>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const editorOptions = {
    mode: "text/x-pgsql",
    theme: "pista",
    lineNumbers: true,
    indentUnit: 4,
    extraKeys: {
      "Ctrl-Enter": () => run(),
      "Cmd-Enter": () => run(),
      // Indent with spaces, as the sample files do.
      Tab: (cm) => cm.replaceSelection("    "),
    },
  };
  const current = CodeMirror.fromTextArea($("current"), editorOptions);
  const desired = CodeMirror.fromTextArea($("desired"), editorOptions);
  const output = $("output");
  const runButton = $("run");
  const status = $("status");

  async function loadSample() {
    const [c, d] = await Promise.all([
      fetch("current.sql").then((r) => r.text()),
      fetch("desired.sql").then((r) => r.text()),
    ]);
    current.setValue(c);
    desired.setValue(d);
  }

  function render(text, isError) {
    output.className = isError ? "error" : "cm-s-pista";
    output.textContent = "";
    if (isError) {
      output.textContent = text;
      return;
    }
    CodeMirror.runMode(text, "text/x-pgsql", output);
  }

  // Only the newest request may update the page: an older one that answers
  // late must not overwrite its result.
  let latest = 0;

  async function run() {
    const id = ++latest;
    runButton.disabled = true;
    status.textContent = "Running... (the first run starts the container)";
    const started = performance.now();
    try {
      const allowDrop = $("allow-drop").value;
      const res = await fetch("/api/diff", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          current: current.getValue(),
          desired: desired.getValue(),
          allow_drop: allowDrop ? [allowDrop] : [],
          manage_routine: $("manage-routine").checked,
          bulk_alter: $("bulk-alter").checked,
        }),
      });
      const body = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      if (id !== latest) return;
      if (body.error) {
        render(body.error, true);
      } else {
        render(body.output.replace(/\n$/, ""), false);
      }
      status.textContent = `Done in ${Math.round(performance.now() - started)} ms`;
    } catch (e) {
      if (id !== latest) return;
      render(String(e), true);
      status.textContent = "";
    } finally {
      if (id === latest) runButton.disabled = false;
    }
  }

  runButton.addEventListener("click", run);
  $("reset").addEventListener("click", async () => {
    await loadSample();
    run();
  });
  // Outside the editors. Inside them, extraKeys has run the diff already and
  // marked the event handled.
  document.addEventListener("keydown", (e) => {
    if (e.defaultPrevented) return;
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      run();
    }
  });
  loadSample().then(run);
</script>
</body>
</html>
